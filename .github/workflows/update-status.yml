
name: Update Hosting Status

on:
  pull_request:
    types:
      - closed
    branches:
      - main

  schedule:
    - cron: "0 6 1 * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hosting-status
  cancel-in-progress: false

jobs:
  update-status:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Generate STATUS.md
        shell: bash
        run: |
          python3 <<'PY'
          import re
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor

          readme_path = Path("README.md")
          status_path = Path("STATUS.md")

          if not readme_path.exists():
              raise FileNotFoundError("README.md was not found")

          readme = readme_path.read_text(encoding="utf-8")

          services = []
          seen_urls = set()

          sections = re.split(r"(?=^## )", readme, flags=re.MULTILINE)

          ignored_sections = {
              "📚 Categories",
              "🤝 Promote or Feature Your Service"
          }

          row_pattern = re.compile(
              r"^\|\s*(\d+)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*(https?://[^|\s]+)\s*\|",
              re.MULTILINE
          )

          for section in sections:
              heading = re.match(r"^## (.+)", section)

              if not heading:
                  continue

              category = heading.group(1).strip()

              if category in ignored_sections:
                  continue

              for match in row_pattern.finditer(section):
                  number, service, description, free_tier, url = match.groups()
                  url = url.strip().rstrip(".,)")

                  if url in seen_urls:
                      continue

                  seen_urls.add(url)

                  services.append({
                      "category": category,
                      "number": int(number),
                      "service": service.strip(),
                      "url": url
                  })

          if not services:
              raise RuntimeError("No hosting services were found in README.md")

          print(f"Found {len(services)} services in README.md")

          def check_url(url):
              try:
                  result = subprocess.run(
                      [
                          "curl",
                          "-L",
                          "-sS",
                          "-o",
                          "/dev/null",
                          "-w",
                          "%{http_code}|%{url_effective}",
                          "--connect-timeout",
                          "5",
                          "--max-time",
                          "15",
                          "--max-redirs",
                          "10",
                          "--proto",
                          "=http,https",
                          "-A",
                          "Mozilla/5.0 (compatible; HostingStatusBot/1.0)",
                          url
                      ],
                      capture_output=True,
                      text=True,
                      timeout=20
                  )

                  output = result.stdout.strip()

                  if "|" not in output:
                      if result.returncode == 28:
                          return "TIMEOUT", "N/A", url
                      return "ERROR", "N/A", url

                  status_code, final_url = output.split("|", 1)

                  if status_code == "000":
                      if result.returncode == 28:
                          return "TIMEOUT", status_code, final_url or url
                      return "ERROR", status_code, final_url or url

                  if status_code.startswith("2"):
                      return "ONLINE", status_code, final_url

                  if status_code.startswith("3"):
                      return "REDIRECT", status_code, final_url

                  if status_code.startswith("4"):
                      return "OFFLINE", status_code, final_url

                  if status_code.startswith("5"):
                      return "ERROR", status_code, final_url

                  return "UNKNOWN", status_code, final_url or url

              except subprocess.TimeoutExpired:
                  return "TIMEOUT", "N/A", url

              except Exception as exc:
                  print(f"Request failed for {url}: {exc}")
                  return "ERROR", "N/A", url

          def check_service(service):
              status, code, final_url = check_url(service["url"])

              return {
                  **service,
                  "status": status,
                  "code": code,
                  "final_url": final_url
              }

          with ThreadPoolExecutor(max_workers=10) as executor:
              results = list(executor.map(check_service, services))

          for index, result in enumerate(results, 1):
              print(
                  f"[{index}/{len(results)}] "
                  f"{result['service']}: "
                  f"{result['status']} ({result['code']})"
              )

          total = len(results)
          online = sum(r["status"] == "ONLINE" for r in results)
          redirects = sum(r["status"] == "REDIRECT" for r in results)
          offline = sum(r["status"] == "OFFLINE" for r in results)
          errors = sum(r["status"] == "ERROR" for r in results)
          timeouts = sum(r["status"] == "TIMEOUT" for r in results)
          unknown = sum(r["status"] == "UNKNOWN" for r in results)

          status_icons = {
              "ONLINE": "🟢 Online",
              "REDIRECT": "🟡 Redirect",
              "OFFLINE": "🔴 Offline",
              "TIMEOUT": "⚠️ Timeout",
              "ERROR": "⚠️ Error",
              "UNKNOWN": "❔ Unknown"
          }

          checked_at = datetime.now(timezone.utc).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          lines = [
              "# 🌐 Hosting Status",
              "",
              "Automatically generated from the hosting services listed in `README.md`.",
              "",
              f"**Last checked:** {checked_at}",
              "",
              "## 📊 Summary",
              "",
              "| Metric | Count |",
              "|---|---:|",
              f"| Total Services | {total} |",
              f"| 🟢 Online | {online} |",
              f"| 🟡 Redirect | {redirects} |",
              f"| 🔴 Offline | {offline} |",
              f"| ⚠️ Error | {errors} |",
              f"| ⏱️ Timeout | {timeouts} |",
              f"| ❔ Unknown | {unknown} |",
              "",
              "## 🔎 Service Status",
              "",
              "| Category | Service | Status | HTTP | Link |",
              "|---|---|---|---:|---|"
          ]

          for result in results:
              status = status_icons[result["status"]]
              service_name = result["service"].replace("[", "\\[").replace("]", "\\]")
              url = result["url"]
              safe_url = url.replace("(", "%28").replace(")", "%29")

              lines.append(
                  f"| {result['category']} | "
                  f"[{service_name}]({safe_url}) | "
                  f"{status} | "
                  f"{result['code']} | "
                  f"{safe_url} |"
              )

          lines.extend([
              "",
              "---",
              "",
              "### ℹ️ Status Definitions",
              "",
              "- 🟢 **Online** — The service returned a successful HTTP response.",
              "- 🟡 **Redirect** — The final HTTP response was a redirect.",
              "- 🔴 **Offline** — The service returned a 4xx response.",
              "- ⚠️ **Error** — The request failed or the server returned a 5xx response.",
              "- ⏱️ **Timeout** — The request exceeded its time limit.",
              "- ❔ **Unknown** — The HTTP status could not be classified.",
              "",
              "> Automated checks may produce false positives due to temporary network issues, rate limits, maintenance, or bot protection.",
              ""
          ])

          status_path.write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print(f"Generated {status_path}")
          print(f"Checked {total} services")
          PY

      - name: Commit and push STATUS.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add STATUS.md

          if git diff --cached --quiet; then
            echo "STATUS.md is already up to date."
            exit 0
          fi

          git commit -m "chore: update hosting status"
          git push origin HEAD:main
