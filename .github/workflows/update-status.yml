
name: Update Hosting Status

on:
  # pull_request_target: fork PRs get read-only GITHUB_TOKEN under pull_request.
  # Safe here: job checks out main only, never PR code.
  pull_request_target:
    types:
      - closed
    branches:
      - main

  schedule:
    - cron: "0 6 1 * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hosting-status
  cancel-in-progress: false

jobs:
  update-status:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate STATUS.md
        shell: bash
        run: |
          python3 <<'PY'
          import re
          import subprocess
          import time
          from urllib.parse import quote
          from pathlib import Path
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor

          readme_path = Path("README.md")
          status_path = Path("STATUS.md")

          if not readme_path.exists():
              raise FileNotFoundError("README.md was not found")

          readme = readme_path.read_text(encoding="utf-8")

          services = []
          seen_urls = set()

          sections = re.split(r"(?=^## )", readme, flags=re.MULTILINE)

          ignored_sections = {
              "📚 Categories",
              "🧭 Quick Pick",
              "🤝 Promote or Feature Your Service"
          }

          row_pattern = re.compile(
              r"^\|\s*\[([^\]]+)\]\((https?://[^)\s]+)\)\s*\|",
              re.MULTILINE
          )

          for section in sections:
              heading = re.match(r"^## (.+)", section)

              if not heading:
                  continue

              category = heading.group(1).strip()

              if category in ignored_sections:
                  continue

              for match in row_pattern.finditer(section):
                  service, url = match.groups()
                  url = url.strip().rstrip(".,)")

                  if url in seen_urls:
                      continue

                  seen_urls.add(url)

                  services.append({
                      "category": category,
                      "service": service.strip(),
                      "url": url
                  })

          if not services:
              raise RuntimeError("No hosting services were found in README.md")

          print(f"Found {len(services)} services in README.md")

          def classify(code, server, cf_mitigated):
              """Map an HTTP result to a status. Bot protection is never reported as Offline/Error."""
              behind_cloudflare = "cloudflare" in server.lower()

              # Cloudflare challenge page ("Just a moment...") — the site is up, the bot was challenged.
              if cf_mitigated:
                  return "BLOCKED"

              if code.startswith("2"):
                  return "ONLINE"
              if code.startswith("3"):
                  return "REDIRECT"

              # Auth / bot-protection / rate limit responses mean the server is alive.
              if code in {"401", "403", "406", "429"}:
                  return "BLOCKED"

              # Cloudflare edge answers 503 for "Under Attack" mode challenges.
              if code == "503" and behind_cloudflare:
                  return "BLOCKED"

              if code.startswith("4"):
                  return "OFFLINE"

              # 5xx (incl. Cloudflare 52x = origin unreachable) is a real error.
              if code.startswith("5"):
                  return "ERROR"

              return "UNKNOWN"

          def check_url(url):
              try:
                  result = subprocess.run(
                      [
                          "curl",
                          "-L",
                          "-sS",
                          "-o",
                          "/dev/null",
                          "-w",
                          "%{http_code}|%{url_effective}|%header{server}|%header{cf-mitigated}",
                          "--connect-timeout",
                          "10",
                          "--max-time",
                          "20",
                          "--max-redirs",
                          "10",
                          "--proto",
                          "=http,https",
                          "-H",
                          "Accept: text/html,application/xhtml+xml,*/*;q=0.8",
                          "-H",
                          "Accept-Language: en-US,en;q=0.9",
                          "-A",
                          "Mozilla/5.0 (compatible; HostingStatusBot/1.0; +https://github.com/nuhmanpk/Awesome-Web-Hosting)",
                          url
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30
                  )

                  parts = result.stdout.strip().split("|")

                  if len(parts) < 4:
                      return ("TIMEOUT" if result.returncode == 28 else "ERROR"), "N/A", url

                  code, final_url, server, cf_mitigated = parts[0], parts[1], parts[2], parts[3]

                  if code == "000":
                      return ("TIMEOUT" if result.returncode == 28 else "ERROR"), code, final_url or url

                  return classify(code, server, cf_mitigated), code, final_url or url

              except subprocess.TimeoutExpired:
                  return "TIMEOUT", "N/A", url

              except Exception as exc:
                  print(f"Request failed for {url}: {exc}")
                  return "ERROR", "N/A", url

          RETRY_STATUSES = {"OFFLINE", "ERROR", "TIMEOUT", "UNKNOWN"}

          def check_service(service):
              status, code, final_url = check_url(service["url"])

              # Retry once after a pause so transient blips are not reported as outages.
              if status in RETRY_STATUSES:
                  time.sleep(5)
                  status, code, final_url = check_url(service["url"])

              return {
                  **service,
                  "status": status,
                  "code": code,
                  "final_url": final_url
              }

          with ThreadPoolExecutor(max_workers=10) as executor:
              results = list(executor.map(check_service, services))

          for index, result in enumerate(results, 1):
              print(
                  f"[{index}/{len(results)}] "
                  f"{result['service']}: "
                  f"{result['status']} ({result['code']})"
              )

          total = len(results)
          order = ["ONLINE", "REDIRECT", "BLOCKED", "OFFLINE", "ERROR", "TIMEOUT", "UNKNOWN"]
          counts = {s: sum(r["status"] == s for r in results) for s in order}
          reachable = counts["ONLINE"] + counts["REDIRECT"] + counts["BLOCKED"]
          pct = round(100 * reachable / total) if total else 0

          status_icons = {
              "ONLINE": "🟢 Online",
              "REDIRECT": "🟡 Redirect",
              "BLOCKED": "🛡️ Blocked",
              "OFFLINE": "🔴 Offline",
              "ERROR": "⚠️ Error",
              "TIMEOUT": "⏱️ Timeout",
              "UNKNOWN": "❔ Unknown"
          }
          notes = {
              "BLOCKED": "Site is up but refused the automated check (bot protection).",
              "OFFLINE": "Returned a 4xx error. Page may have moved or service shut down.",
              "ERROR": "Connection failed or server error (5xx). Domain may be dead.",
              "TIMEOUT": "No response within 20 seconds, twice.",
              "REDIRECT": "Ended on a redirect.",
              "UNKNOWN": "Unexpected HTTP response."
          }

          def note_for(r):
              if r["status"] == "ERROR" and not r["code"].startswith("5"):
                  return "Could not connect (DNS, TLS or network failure), twice. Domain may be dead."
              if r["status"] == "ERROR":
                  return "Server error (5xx). Service may be down."
              return notes[r["status"]]

          def esc(text):
              return text.replace("|", "\\|").replace("[", "\\[").replace("]", "\\]")

          def link(r):
              return f"[{esc(r['service'])}]({r['url'].replace('(', '%28').replace(')', '%29')})"

          def badge(label, value, color):
              q = lambda s: quote(s.replace("-", "--").replace("_", "__"), safe="")
              return f"![{label}](https://img.shields.io/badge/{q(label)}-{q(value)}-{color}?style=for-the-badge)"

          health_color = "2ea44f" if pct >= 90 else "dbab09" if pct >= 75 else "d73a49"
          checked_at = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          lines = [
              '<a id="top"></a>',
              "",
              '<div align="center">',
              "",
              "# 🌐 Hosting Status",
              "",
              "**Live reachability check for every service in [Free Web Hosting Gems](README.md).**",
              "",
              badge("Reachable", f"{pct}%", health_color) + " " + badge("Services", str(total), "0366d6"),
              "",
              f"🕒 Last checked **{checked_at}** · [← Back to the list](README.md)",
              "",
              "</div>",
              "",
              "---",
              "",
              "## 📊 Summary",
              "",
              "| " + " | ".join(status_icons[s] for s in order) + " |",
              "|" + ":---:|" * len(order),
              "| " + " | ".join(f"**{counts[s]}**" for s in order) + " |",
              "",
          ]

          attention = [r for r in results if r["status"] != "ONLINE"]
          lines += ["## 🚨 Needs Attention", ""]
          if attention:
              lines += [
                  "These services did not return a clean response. Please verify before relying on them, and [open an issue](https://github.com/nuhmanpk/Awesome-Web-Hosting/issues/new) if one is gone for good.",
                  "",
                  "| Service | Category | Status | HTTP | What it means |",
                  "|---|---|---|:---:|---|",
              ]
              for r in sorted(attention, key=lambda r: (order.index(r["status"]), r["service"].lower())):
                  lines.append(f"| {link(r)} | {r['category']} | {status_icons[r['status']]} | `{r['code']}` | {note_for(r)} |")
          else:
              lines.append("✅ Every listed service responded normally.")
          lines += ["", "## 🗂️ By Category", ""]

          categories = list(dict.fromkeys(r["category"] for r in results))
          for cat in categories:
              rows = sorted((r for r in results if r["category"] == cat), key=lambda r: r["service"].lower())
              up = sum(r["status"] == "ONLINE" for r in rows)
              mark = "✅" if up == len(rows) else "⚠️"
              lines += [
                  "<details>",
                  f"<summary><b>{cat}</b> — {mark} {up}/{len(rows)} online</summary>",
                  "",
                  "| Service | Status | HTTP |",
                  "|---|---|:---:|",
              ]
              lines += [f"| {link(r)} | {status_icons[r['status']]} | `{r['code']}` |" for r in rows]
              lines += ["", "</details>", ""]

          lines += [
              "---",
              "",
              "<details>",
              "<summary><b>ℹ️ Status legend & how checks work</b></summary>",
              "",
              "| Status | Meaning |",
              "|---|---|",
              "| 🟢 Online | Returned a 2xx response. |",
              "| 🟡 Redirect | Final response was a 3xx redirect. |",
              "| 🛡️ Blocked | Site answered but blocked the check: a Cloudflare challenge, or 401, 403, 406, 429, or a Cloudflare 503. Usually up. |",
              "| 🔴 Offline | Returned another 4xx response (e.g. 404, 410). |",
              "| ⚠️ Error | Connection failed (DNS, TLS) or a 5xx server error, including Cloudflare 52x (origin down). |",
              "| ⏱️ Timeout | No response within 20 seconds. |",
              "| ❔ Unknown | Response could not be classified. |",
              "",
              "Checks run monthly and after each merged PR, with one HTTP request per homepage from a GitHub Actions runner. Failures are retried once after 5 seconds. Results can include false alarms from rate limits, maintenance or bot protection. A homepage being up does **not** confirm the free tier still exists.",
              "",
              "</details>",
              "",
              '<div align="right"><a href="#top">↑ Back to top</a></div>',
              ""
          ]

          status_path.write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print(f"Generated {status_path}")
          print(f"Checked {total} services")
          PY

      - name: Commit and push STATUS.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add STATUS.md

          if git diff --cached --quiet; then
            echo "STATUS.md is already up to date."
            exit 0
          fi

          git commit -m "chore: update hosting status"
          git pull --rebase origin main
          git push origin HEAD:main
